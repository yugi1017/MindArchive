<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人学习知识库</title>
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MotionPathPlugin.min.js"></script>
</head>
<body>
    <div class="app-container home-view" id="homeView">
        <header class="home-header">
            <div class="header-content">
                <h1 class="site-title">📚 个人学习知识库</h1>
                <p class="site-subtitle">系统化管理你的学习资料，构建个人知识体系</p>
            </div>
            <div class="header-search">
                <div class="search-wrapper">
                    <input type="text" id="homeSearchInput" placeholder="搜索资料、书籍、笔记..." autocomplete="off">
                    <button id="homeSearchBtn" class="search-btn">🔍 搜索</button>
                </div>
            </div>
        </header>
        
        <main class="home-main">
            <section class="stats-section">
                <div class="stat-card">
                    <span class="stat-number" id="totalBooks">0</span>
                    <span class="stat-label">书籍数量</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="totalDocs">0</span>
                    <span class="stat-label">文档总数</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="totalTags">0</span>
                    <span class="stat-label">标签数量</span>
                </div>
            </section>
            
            <section class="books-section">
                <h2 class="section-title">📚 我的书架</h2>
                <div class="books-grid" id="booksGrid"></div>
            </section>
        </main>
        
        <footer class="home-footer">
            <p>个人学习知识库 v1.0.0 | 持续学习，不断进步</p>
            <p><a href="https://github.com/yugi1017/MindArchive" target="_blank">GitHub 仓库</a></p>
        </footer>
    </div>
    
    <div class="app-container book-view hidden" id="bookView">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="#" class="logo-link" id="backToHome">
                    <h1 class="logo">📚 知识库</h1>
                </a>
                <div class="current-book" id="currentBook"></div>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索资料..." autocomplete="off">
                    <button id="searchBtn" class="search-btn">🔍</button>
                </div>
            </div>
            
            <nav class="nav-menu" id="navMenu">
                <div class="nav-section">
                    <h3 class="nav-title">
                        <span class="nav-icon">📖</span>
                        <span id="navBookTitle">目录</span>
                    </h3>
                    <ul class="nav-list" id="chapterList"></ul>
                </div>
            </nav>
            
            <div class="sidebar-footer">
                <a href="#" class="back-home-link" id="sidebarBackHome">← 返回书架</a>
                <span class="version">v1.0.0</span>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="content-header">
                <button class="mobile-menu-btn" id="mobileMenuBtn" title="菜单">☰</button>
                <div class="breadcrumb" id="breadcrumb">
                    <a href="#" class="breadcrumb-item" id="breadcrumbHome">书架</a>
                </div>
                <div class="toolbar">
                    <button id="toggleToc" class="toolbar-btn" title="目录">📑 目录</button>
                    <button id="backTop" class="toolbar-btn" title="返回顶部">⬆️ 顶部</button>
                </div>
            </header>
            
            <article class="content-body" id="contentBody">
                <div class="loading"></div>
            </article>
            
            <aside class="toc-panel" id="tocPanel">
                <h3 class="toc-title">目录</h3>
                <nav class="toc-list" id="tocList"></nav>
            </aside>
        </main>
    </div>
    
    <div class="search-modal" id="searchModal">
        <div class="search-modal-content">
            <div class="search-modal-header">
                <input type="text" id="modalSearchInput" placeholder="输入关键词搜索..." autocomplete="off">
                <button class="close-modal" id="closeSearchModal">×</button>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>
    
    <script src="./src/js/app.js"></script>
</body>
</html>
