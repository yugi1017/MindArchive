<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#aiGradient)" opacity="0.15"/>

  <!-- Outer Ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#aiGradient)" stroke-width="2"/>

  <!-- Neural Network Nodes -->
  <!-- Top Layer -->
  <circle cx="32" cy="14" r="4" fill="url(#nodeGradient)"/>
  <circle cx="18" cy="22" r="3.5" fill="url(#nodeGradient)"/>
  <circle cx="46" cy="22" r="3.5" fill="url(#nodeGradient)"/>

  <!-- Middle Layer -->
  <circle cx="32" cy="28" r="5" fill="url(#aiGradient)"/>
  <circle cx="16" cy="34" r="3" fill="url(#nodeGradient)"/>
  <circle cx="48" cy="34" r="3" fill="url(#nodeGradient)"/>

  <!-- Bottom Layer -->
  <circle cx="32" cy="46" r="4" fill="url(#nodeGradient)"/>
  <circle cx="20" cy="42" r="3" fill="url(#nodeGradient)"/>
  <circle cx="44" cy="42" r="3" fill="url(#nodeGradient)"/>

  <!-- Connection Lines -->
  <!-- Top to Middle -->
  <line x1="32" y1="18" x2="32" y2="23" stroke="url(#aiGradient)" stroke-width="1.5" opacity="0.8"/>
  <line x1="18" y1="25.5" x2="28" y2="26" stroke="url(#aiGradient)" stroke-width="1.5" opacity="0.8"/>
  <line x1="46" y1="25.5" x2="36" y2="26" stroke="url(#aiGradient)" stroke-width="1.5" opacity="0.8"/>

  <!-- Middle to Bottom -->
  <line x1="32" y1="33" x2="32" y2="42" stroke="url(#aiGradient)" stroke-width="1.5" opacity="0.8"/>
  <line x1="18" y1="34" x2="28" y2="30" stroke="url(#aiGradient)" stroke-width="1.5" opacity="0.8"/>
  <line x1="48" y1="34" x2="36" y2="30" stroke="url(#aiGradient)" stroke-width="1.5" opacity="0.8"/>
  <line x1="20" y1="42" x2="28" y2="30" stroke="url(#aiGradient)" stroke-width="1.5" opacity="0.8"/>
  <line x1="44" y1="42" x2="36" y2="30" stroke="url(#aiGradient)" stroke-width="1.5" opacity="0.8"/>

  <!-- Side Connections -->
  <line x1="18" y1="22" x2="20" y2="42" stroke="url(#aiGradient)" stroke-width="1" opacity="0.5"/>
  <line x1="46" y1="22" x2="44" y2="42" stroke="url(#aiGradient)" stroke-width="1" opacity="0.5"/>

  <!-- Center Glow Effect -->
  <circle cx="32" cy="28" r="8" fill="url(#aiGradient)" opacity="0.3"/>
</svg>